<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efeeea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tasks">
<title>Tasks</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeeea;--ink:#111110;--txt:#3b3a37;--mute:#7c7b77;--rule:#8f8e8a;--soft:#c9c8c3;--chip:#e1e0db}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 24px calc(48px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;height:calc(68px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
.ib{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;padding:0;cursor:pointer;border-radius:2px;color:var(--ink)}
.ib.box{background:var(--chip)}
.ib svg{width:22px;height:22px}
.ib.sm{width:34px;height:34px;color:var(--mute)}
.ib.sm svg{width:18px;height:18px}
.ib.armed{color:#b3261e}
.sp{width:40px}
svg{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink);transition:background .2s}
.dot.local{background:none;border:1.4px solid var(--mute)}
.dot.busy{background:var(--soft);animation:p 1s infinite alternate}
.dot.err{background:#b3261e}
@keyframes p{to{opacity:.3}}
.list{margin-top:40px}
.cat{border-top:1px solid var(--rule)}
.row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.row{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.l0>.row{padding:16px 0 14px}
.l0>.row .name{font-size:clamp(30px,8.6vw,40px);font-weight:700;letter-spacing:-.028em;line-height:1.05}
.today>.row{cursor:default}
.l1{border-top:0;margin-top:14px}
.l1>.row{padding:12px 0 10px}
.l1>.row .name{font-size:clamp(22px,6.2vw,27px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
sup{font-size:clamp(13px,3.6vw,16px);font-weight:400;letter-spacing:0;vertical-align:top;line-height:1;margin-left:4px;position:relative;top:.15em}
.tog{color:var(--ink);display:grid}
.tog svg{width:22px;height:22px;stroke-width:1}
.body{padding:0 0 22px}
.l1 .body{padding-bottom:10px}
.tasks{list-style:none;margin:0;padding:0}
.tasks button{all:unset;box-sizing:border-box;display:block;width:100%;padding:6px 0;font-size:20px;line-height:1.3;color:var(--txt);cursor:pointer;overflow-wrap:anywhere}
.tasks button{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.due{font-size:14px;color:var(--mute);white-space:nowrap;flex:none}
.add .dm{display:none}
.add.typing .dm{display:flex;color:var(--mute)}
.dm{position:relative;flex:none;display:flex;align-items:center;justify-content:flex-end;min-width:30px;min-height:32px;color:var(--soft);font-size:14px;white-space:nowrap;cursor:pointer}
.dm.on{color:var(--mute)}
.dm svg{width:16px;height:16px}
.daterow{display:flex;align-items:center;gap:4px;margin-top:6px}
.date{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:40px;color:var(--mute);font-size:17px;cursor:pointer}
.date svg{width:20px;height:20px}
.dm,.date{border:0;background:none;padding:0;font:inherit}
.cal{position:fixed;z-index:20;background:var(--bg);border:1px solid var(--soft);border-radius:6px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);width:272px;-webkit-user-select:none;user-select:none}
.cal .hd{display:flex;align-items:center;justify-content:space-between;font-weight:500;font-size:16px;margin-bottom:6px}
.cal .hd .ib{width:34px;height:34px}
.cal .hd svg{width:18px;height:18px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .w{font-size:12px;color:var(--mute);padding:4px 0}
.cal .d{all:unset;height:34px;border-radius:50%;font-size:15px;cursor:pointer;display:grid;place-items:center}
.cal .d:hover{background:var(--chip)}
.cal .d.t{font-weight:700}
.cal .d.s{background:var(--ink);color:var(--bg)}
.tasks button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.menu{position:fixed;z-index:20;background:var(--bg);border:1px solid var(--soft);border-radius:4px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.14)}
.menu button{all:unset;display:flex;align-items:center;gap:8px;padding:8px 16px 8px 10px;font-size:16px;color:var(--ink);cursor:pointer;border-radius:3px}
.menu button.red{color:#b3261e}
.menu button:hover{background:var(--chip)}
.menu .sure{display:flex;align-items:center;gap:2px;padding:2px 2px 2px 12px;font-size:16px}
.menu .sure span{margin-right:8px}
.menu .sure .ib{width:36px;height:36px;padding:0;display:grid;place-items:center}
.menu svg{width:18px;height:18px}
.tasks button:hover{color:var(--ink)}
.add{display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--soft)}
.add svg{width:18px;height:18px;flex:none}
.add input[data-add],.newcat input{all:unset;flex:1;min-width:0;font-size:20px;line-height:1.3;color:var(--ink)}
.add:focus-within{color:var(--mute)}
.tools{display:flex;gap:2px;margin:10px 0 0 -9px}
.tools sup{font-size:11px;margin-left:1px;top:-2px}
.tools .ib{position:relative}
.newcat{display:flex;align-items:center;padding:14px 0 12px;border-top:1px solid var(--rule)}
.newcat input{font-size:clamp(30px,8.6vw,40px);font-weight:700;letter-spacing:-.028em}
.newcat.sub{border-top:0;margin-top:12px;padding:12px 0 10px}
.newcat.sub input{font-size:clamp(22px,6.2vw,27px)}
.foot{border-top:1px solid var(--rule);padding-top:10px}
.foot .ib{margin-left:-9px}
.path{font-size:15px;color:var(--mute);margin:36px 0 10px}
textarea{all:unset;display:block;width:100%;white-space:pre-wrap;overflow-wrap:anywhere;resize:none;overflow:hidden}
.title{font-size:clamp(30px,8.4vw,40px);font-weight:700;letter-spacing:-.025em;line-height:1.08;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.notes{font-size:19px;line-height:1.45;color:var(--txt);min-height:140px;padding:16px 0}
.done{height:36px;padding:0 14px 0 10px;border-radius:18px;border:1.2px solid var(--ink);background:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-top:18px;color:var(--ink);font-size:15px;transition:background .15s,color .15s}
.done svg{width:18px;height:18px}
.done.on{background:var(--ink);color:var(--bg)}
.atitle{font-size:clamp(30px,8.6vw,40px);font-weight:700;letter-spacing:-.028em;line-height:1.05;padding:16px 0 14px;border-bottom:1px solid var(--rule);margin:0 0 10px;display:flex;align-items:center;gap:12px}
.atitle svg{width:24px;height:24px;stroke-width:1.2;flex:none}
.asub{font-size:clamp(22px,6.2vw,27px);font-weight:700;letter-spacing:-.02em;line-height:1.1;padding:12px 0 8px;margin-top:14px}
.cv{margin-top:24px}
.cv .hd{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700;letter-spacing:-.01em;padding-bottom:10px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.cv .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cv .w{font-size:12px;color:var(--mute);padding:6px 0}
.cv .d{all:unset;height:54px;display:grid;place-items:center;cursor:pointer;position:relative;font-size:17px}
.cv .d span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.cv .d:hover span{background:var(--chip)}
.cv .d.t span{font-weight:700}
.cv .d.s span{background:var(--ink);color:var(--bg)}
.cv .d.h::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--ink)}
.wide .wrap{max-width:1180px}
.gg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:4px}
.gg>:nth-child(7n+8){border-left:1px solid var(--soft)}
.gw{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:14px 8px 10px;border-right:1px solid transparent}
.ge,.gd{border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);min-height:clamp(84px,14vw,150px)}
.gw:nth-child(-n+7){border-bottom:1px solid var(--soft)}
.gd{padding:clamp(5px,1vw,12px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.gd b{font-size:clamp(18px,3.2vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1;margin-bottom:clamp(4px,.8vw,10px)}
.gd.p b{color:var(--soft)}
.gd.t{background:#fff}
.gd button{all:unset;display:block;width:100%;font-size:clamp(10px,1.1vw,13px);line-height:1.3;color:var(--txt);cursor:pointer;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.gd button:hover{color:var(--ink)}
.cvl{margin-top:14px;border-top:1px solid var(--rule);padding-top:8px}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.att-img{all:unset;width:84px;height:84px;border-radius:4px;background:var(--chip);overflow:hidden;cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.att-img img{width:100%;height:100%;object-fit:cover;display:block}
.att-img.up{animation:p 1s infinite alternate}
.attf{margin-top:8px}
.att-file{all:unset;display:flex;align-items:center;gap:8px;width:100%;padding:6px 0;font-size:16px;color:var(--txt);cursor:pointer;overflow-wrap:anywhere;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.att-file svg{width:18px;height:18px;flex:none;color:var(--mute)}
.drop #tv{outline:1.5px dashed var(--mute);outline-offset:12px;border-radius:4px}
.lb{position:fixed;inset:0;z-index:30;background:rgba(239,238,234,.97);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.key{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding:14px 0;margin-top:20px}
.key input{all:unset;flex:1;min-width:0;font-size:20px}
.key.bad{border-bottom-color:#b3261e;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.key>svg{width:22px;height:22px;color:var(--mute);flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header id="hd"></header>
  <main id="app"></main>
</div>
<script>
/* ---------- config ---------- */
const CFG = { owner: 'farzadbayan', repo: 'todo-data', branch: null, path: 'tasks.json' };
const LOCK = {"s": "anDW/3F+eva5F6MIwlgxRg==", "v": "uosbDmtJyv8rfTz4", "c": "xaW7w+BIwVW09EAwsfTTqacYV3RlIoGCfahY9Aiz7P2bacMwvSyP3eWz2tLDFLQ2uz/4yxcxgcr1BIFewTY3J9/DOHI31H0uMqhjLZ0Jblui57iBevB2K7f41fVPKTbtBSMCyVPfYnvukmMmsg==", "i": 600000};

/* ---------- icons ---------- */
const I = {
  plus:  '<svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>',
  minus: '<svg viewBox="0 0 24 24"><path d="M4 12h16"/></svg>',
  x:     '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  arch:  '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx=".5"/><path d="M5 8v11.5h14V8M10 12h4"/></svg>',
  sub:   '<svg viewBox="0 0 24 24"><path d="M3 6.5h6.5l2 2H21v11H3z"/><path d="M12 11.5v5M9.5 14h5"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2L18.5 8"/></svg>',
  cal:   '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="1"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  prev:  '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next:  '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  grid:  '<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1"/><path d="M3.5 9.5h17M3.5 14.5h17M9.2 9.5v10M14.8 9.5v10"/></svg>',
  clip:  '<svg viewBox="0 0 24 24"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>',
  file:  '<svg viewBox="0 0 24 24"><path d="M14 3.5H6.5v17h11V7z"/><path d="M14 3.5V7h3.5"/></svg>',
  key:   '<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2.5 2.5M14 9l2 2"/></svg>',
};

/* ---------- storage ---------- */
const ls = (k, v) => v === undefined ? localStorage.getItem('todo.' + k) : localStorage.setItem('todo.' + k, v);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const DEFAULT = () => ({ v: 1, cats: [
  { id: 'cm', name: 'Clarified Mind', parent: null },
  { id: 'dd', name: 'Dark Digital', parent: null },
  { id: 'peak', name: 'Peak', parent: 'dd' },
  { id: 'gs', name: 'Genspark', parent: 'dd' },
  { id: 'game', name: 'Game', parent: null },
  { id: 'lang', name: 'Language App', parent: null },
  { id: 'other', name: 'Other Tasks', parent: null },
], tasks: [] });

let state; try { state = JSON.parse(ls('state')) } catch {} if (!state) state = DEFAULT();
let token = ls('token') || '';
let sha = ls('sha') || null;
let dirty = ls('dirty') === '1';
let open = new Set(JSON.parse(ls('open') || '[]'));
let adding = null;          // {parent: id|null} while creating a cat / sub-cat
let status = token ? 'ok' : 'local';
const ser = () => JSON.stringify(state, null, 1);

function save(delay = 700) {
  ls('state', ser()); dirty = true; ls('dirty', '1');
  schedule(delay);
}

/* ---------- GitHub sync ---------- */
const enc = s => { const b = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(o); };
const dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const API = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/`;
const gh = (method, body, p = 'contents/' + CFG.path) =>
  fetch(API + p + (method === 'GET' && p.startsWith('contents') && CFG.branch ? '?ref=' + CFG.branch : ''), {
    method, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
    body: body ? JSON.stringify(body) : undefined,
  });

let timer, busy = false, again = false;
const oldShas = new Set(JSON.parse(ls('old') || '[]'));
function retire(x) { if (!x) return; oldShas.add(x); ls('old', JSON.stringify([...oldShas].slice(-50))); }
function setStatus(s) { status = s; const d = document.querySelector('.dot'); if (d) d.className = 'dot ' + s; }
function schedule(delay) {
  if (!token) return setStatus('local');
  clearTimeout(timer); timer = setTimeout(push, delay);
}
async function ensureBranch() {
  const r = await gh('GET', null, ''); if (!r.ok) return false;
  const def = (await r.json()).default_branch;
  const ref = await gh('GET', null, 'git/ref/heads/' + def); if (!ref.ok) return false;
  const head = (await ref.json()).object.sha;
  return (await gh('POST', { ref: 'refs/heads/' + CFG.branch, sha: head }, 'git/refs')).ok;
}
async function push(retry = 2) {
  if (!token) return;
  if (busy) { again = true; return; }
  busy = true; setStatus('busy');
  let ok = false;
  try {
    const snap = ser();
    const r = await gh('PUT', { message: 'tasks', content: enc(snap), ...(CFG.branch ? { branch: CFG.branch } : {}), ...(sha ? { sha } : {}) });
    if (r.ok) {
      retire(sha); sha = (await r.json()).content.sha; ls('sha', sha); ok = true;
      if (ser() === snap) { dirty = false; ls('dirty', '0'); }
    } else if (retry && (r.status === 409 || r.status === 422 || r.status === 404)) {
      const g = await gh('GET');
      if (g.ok) sha = (await g.json()).sha;
      else if (g.status === 404) { sha = null; if (CFG.branch) await ensureBranch(); }
      busy = false; return push(retry - 1);
    }
  } catch (e) {}
  busy = false;
  setStatus(ok ? 'ok' : 'err');
  if (again || (ok && dirty)) { again = false; schedule(400); }
}
async function pull() {
  if (!token || busy) return;
  if (dirty) return push();
  busy = true; setStatus('busy');
  let ok = false;
  try {
    const r = await gh('GET');
    if (r.status === 404) { sha = null; busy = false; dirty = true; return push(); }
    if (r.ok) {
      const j = await r.json(); ok = true;
      if (oldShas.has(j.sha) || j.sha === sha) { busy = false; setStatus('ok'); return; } // stale or unchanged
      sha = j.sha; ls('sha', sha);
      const txt = dec(j.content);
      if (!dirty && txt !== ser()) { state = JSON.parse(txt); ls('state', ser()); render(); }
    }
  } catch (e) {}
  busy = false; setStatus(ok ? 'ok' : 'err');
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const cat = id => state.cats.find(c => c.id === id);
const subsOf = id => state.cats.filter(c => c.parent === id);
const tasksOf = (id, done) => state.tasks.filter(t => t.cat === id && !!t.done === done);
const openCount = id => tasksOf(id, false).length + subsOf(id).reduce((n, s) => n + openCount(s.id), 0);
const fmtD = v => { if (!v) return ''; const d = new Date(v + 'T00:00'); return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', ...(d.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) }); };
const taskLi = t => `<li><button data-act="task" data-id="${t.id}"><span>${esc(t.title) || '·'}</span>${t.due ? `<span class="due">${fmtD(t.due)}</span>` : ''}</button></li>`;
const sup = n => n ? `<sup>(${n})</sup>` : '';

/* ---------- routing ---------- */
let view = '', vid = null;
function route() { const [, v, id] = (location.hash.slice(1) || '/').split('/'); view = v || ''; vid = id ? decodeURIComponent(id) : null; adding = null; render(); window.scrollTo(0, 0); }
function nav(h) { history.pushState({ app: 1 }, '', h); route(); }
function back() {
  if (history.state && history.state.app) return history.back();
  const t = view === 't' && state.tasks.find(x => x.id === vid);
  history.replaceState(null, '', t && t.done ? '#/a/' + t.cat : '#/'); route();
}
addEventListener('popstate', route);

/* ---------- render ---------- */
const hd = document.getElementById('hd'), app = document.getElementById('app');
const closeBtn = `<button class="ib box" data-act="back" aria-label="Close">${I.x}</button>`;

function catBlock(c, lvl) {
  const isOpen = open.has(c.id), subs = subsOf(c.id), todo = tasksOf(c.id, false), done = tasksOf(c.id, true).length + subs.reduce((n, sc) => n + tasksOf(sc.id, true).length, 0);
  const empty = !subs.length && !todo.length && !done;
  return `<section class="cat l${lvl}">
    <button class="row" data-act="toggle" data-id="${c.id}"><span class="name">${esc(c.name)}${sup(openCount(c.id))}</span><span class="tog">${isOpen ? I.minus : I.plus}</span></button>
    ${isOpen ? `<div class="body">
      <ul class="tasks">${todo.map(taskLi).join('')}</ul>
      ${subs.length ? '' : `<div class="add${pend[c.id] ? ' typing' : ''}">${I.plus}<input data-add="${c.id}" enterkeyhint="done" autocomplete="off" aria-label="Add task"><button class="dm${pend[c.id] ? ' on' : ''}" data-act="pick" data-for="${c.id}" aria-label="Date">${pend[c.id] ? fmtD(pend[c.id]) : I.cal}</button></div>`}
      ${subs.map(s => catBlock(s, lvl + 1)).join('')}

  const u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u(LOCK.s), iterations: LOCK.i, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u(LOCK.v) }, k, u(LOCK.c)));
}
let autoT;
async function saveKey(silent) {
  const el = document.getElementById('tok'); if (!el) return; const pw = el.value.trim(); if (!pw) return;
  if (!silent) el.disabled = true;
  try { token = await unlock(pw); } catch (e) {
    if (silent) return;
    el.disabled = false; el.value = ''; el.parentNode.classList.add('bad'); setTimeout(() => el.parentNode.classList.remove('bad'), 600); el.focus(); return;
  }
  if (el.value.trim() !== pw) return;
  ls('token', token); setStatus('ok');
  if (history.state && history.state.app) history.back(); else { history.replaceState(null, '', '#/'); route(); }
  pull();
}

document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Escape') {
    if (menu) { closeMenu(); return; }
    const lb = document.querySelector('.lb'); if (lb) { lb.remove(); return; }
    if (cal) { closeCal(); return; }
    if (el.dataset && el.dataset.new !== undefined) { adding = null; render(); return; }
    if (view) { el.blur && el.blur(); back(); }
    return;
  }
  if (e.key !== 'Enter' || e.isComposing) return;
  if (el.dataset.add !== undefined) {
    e.preventDefault();
    const title = el.value.trim(); if (!title) return;
    addTask(el.dataset.add, title); el.value = ''; render();
  } else if (el.dataset.new !== undefined) {
    e.preventDefault();
    const name = el.value.trim(), parent = el.dataset.new || null;
    adding = null;
    if (name) { const c = { id: uid(), name, parent }; state.cats.push(c); if (parent) open.add(parent); ls('open', JSON.stringify([...open])); save(); }
    el.value = ''; render();
  } else if (el.dataset.f === 'title') {
    e.preventDefault(); app.querySelector('.notes').focus();
  } else if (el.id === 'tok') saveKey();
});

document.addEventListener('focusout', e => {
  const el = e.target;
  if (!rendering && el.dataset && el.dataset.add !== undefined) {
    const cat = el.dataset.add;
    if (Date.now() < picking || cal) return;
    setTimeout(() => {
      if (cal) return;
      if (document.activeElement === el || !el.value.trim()) return;
      addTask(cat, el.value.trim()); el.value = ''; render();
    }, 150);
    return;
  }
  if (rendering || !el.dataset || el.dataset.new === undefined) return;
  setTimeout(() => { if (adding && !el.value.trim() && document.activeElement !== el) { adding = null; render(); } }, 120);
});

document.addEventListener('input', e => {
  if (e.target.id === 'tok') { clearTimeout(autoT); if (e.target.value.trim().length >= 6) autoT = setTimeout(() => saveKey(true), 350); return; }
  if (e.target.dataset && e.target.dataset.add !== undefined) e.target.parentNode.classList.toggle('typing', !!e.target.value || !!pend[e.target.dataset.add]);
  const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
  const t = state.tasks.find(x => x.id === vid); if (!t) return;
  t[f] = f === 'title' ? el.value.replace(/\n/g, ' ') : el.value;
  fit(el); save(1200);
});

/* ---------- start ---------- */
if (location.hash.startsWith('#key=')) { token = decodeURIComponent(location.hash.slice(5)).trim(); ls('token', token); status = 'ok'; history.replaceState(null, '', location.pathname); }
if (!token) history.replaceState(null, '', '#/k');
route();
if (dirty) schedule(300); else pull();
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
addEventListener('focus', pull);
setInterval(() => { if (!document.hidden) pull(); }, 60000);
</script>
