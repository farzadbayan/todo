<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efeeea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tasks">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeeea;--ink:#111110;--txt:#3b3a37;--mute:#7c7b77;--rule:#8f8e8a;--soft:#c9c8c3;--chip:#e1e0db}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 24px calc(48px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;height:calc(68px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
.ib{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;padding:0;cursor:pointer;border-radius:2px;color:var(--ink)}
.ib.box{background:var(--chip)}
.ib svg{width:22px;height:22px}
.ib.sm{width:34px;height:34px;color:var(--mute)}
.ib.sm svg{width:18px;height:18px}
.ib.armed{color:#b3261e}
.sp{width:40px}
svg{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink);transition:background .2s}
.dot.local{background:none;border:1.4px solid var(--mute)}
.dot.busy{background:var(--soft);animation:p 1s infinite alternate}
.dot.err{background:#b3261e}
@keyframes p{to{opacity:.3}}
.list{margin-top:40px}
.cat{border-top:1px solid var(--rule)}
.row{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.l0>.row{padding:16px 0 14px}
.l0>.row .name{font-size:clamp(30px,8.6vw,40px);font-weight:700;letter-spacing:-.028em;line-height:1.05}
.l1{border-top:1px solid var(--soft);margin-top:12px}
.l1>.row{padding:12px 0 10px}
.l1>.row .name{font-size:clamp(22px,6.2vw,27px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
sup{font-size:clamp(13px,3.6vw,16px);font-weight:400;letter-spacing:0;vertical-align:top;line-height:1;margin-left:4px;position:relative;top:.15em}
.tog{color:var(--ink);display:grid}
.tog svg{width:22px;height:22px;stroke-width:1}
.body{padding:0 0 22px}
.l1 .body{padding-bottom:10px}
.tasks{list-style:none;margin:0;padding:0}
.tasks button{all:unset;box-sizing:border-box;display:block;width:100%;padding:6px 0;font-size:20px;line-height:1.3;color:var(--txt);cursor:pointer;overflow-wrap:anywhere}
.tasks button:hover{color:var(--ink)}
.add{display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--soft)}
.add svg{width:18px;height:18px;flex:none}
.add input,.newcat input{all:unset;flex:1;min-width:0;font-size:20px;line-height:1.3;color:var(--ink)}
.add:focus-within{color:var(--mute)}
.tools{display:flex;gap:2px;margin:10px 0 0 -9px}
.tools sup{font-size:11px;margin-left:1px;top:-2px}
.tools .ib{position:relative}
.newcat{display:flex;align-items:center;padding:14px 0 12px;border-top:1px solid var(--rule)}
.newcat input{font-size:clamp(30px,8.6vw,40px);font-weight:700;letter-spacing:-.028em}
.newcat.sub{border-top-color:var(--soft);margin-top:12px;padding:12px 0 10px}
.newcat.sub input{font-size:clamp(22px,6.2vw,27px)}
.foot{border-top:1px solid var(--rule);padding-top:10px}
.foot .ib{margin-left:-9px}
.path{font-size:15px;color:var(--mute);margin:36px 0 10px}
textarea{all:unset;display:block;width:100%;white-space:pre-wrap;overflow-wrap:anywhere;resize:none;overflow:hidden}
.title{font-size:clamp(30px,8.4vw,40px);font-weight:700;letter-spacing:-.025em;line-height:1.08;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.notes{font-size:19px;line-height:1.45;color:var(--txt);min-height:140px;padding:16px 0}
.done{width:56px;height:56px;border-radius:50%;border:1.4px solid var(--ink);background:none;display:grid;place-items:center;cursor:pointer;margin-top:18px;color:var(--ink);transition:background .15s,color .15s}
.done svg{width:26px;height:26px}
.done.on{background:var(--ink);color:var(--bg)}
.atitle{font-size:clamp(30px,8.6vw,40px);font-weight:700;letter-spacing:-.028em;line-height:1.05;padding:16px 0 14px;border-bottom:1px solid var(--rule);margin:0 0 10px;display:flex;align-items:center;gap:12px}
.atitle svg{width:24px;height:24px;stroke-width:1.2;flex:none}
.key{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding:14px 0;margin-top:20px}
.key input{all:unset;flex:1;min-width:0;font-size:20px}
.key.bad{border-bottom-color:#b3261e;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.key>svg{width:22px;height:22px;color:var(--mute);flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header id="hd"></header>
  <main id="app"></main>
</div>
<script>
/* ---------- config ---------- */
const CFG = { owner: 'farzadbayan', repo: 'todo-data', branch: null, path: 'tasks.json' };
const LOCK = {"s": "anDW/3F+eva5F6MIwlgxRg==", "v": "uosbDmtJyv8rfTz4", "c": "xaW7w+BIwVW09EAwsfTTqacYV3RlIoGCfahY9Aiz7P2bacMwvSyP3eWz2tLDFLQ2uz/4yxcxgcr1BIFewTY3J9/DOHI31H0uMqhjLZ0Jblui57iBevB2K7f41fVPKTbtBSMCyVPfYnvukmMmsg==", "i": 600000};

/* ---------- icons ---------- */
const I = {
  plus:  '<svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>',
  minus: '<svg viewBox="0 0 24 24"><path d="M4 12h16"/></svg>',
  x:     '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  arch:  '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx=".5"/><path d="M5 8v11.5h14V8M10 12h4"/></svg>',
  sub:   '<svg viewBox="0 0 24 24"><path d="M3 6.5h6.5l2 2H21v11H3z"/><path d="M12 11.5v5M9.5 14h5"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2L18.5 8"/></svg>',
  key:   '<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2.5 2.5M14 9l2 2"/></svg>',
};

/* ---------- storage ---------- */
const ls = (k, v) => v === undefined ? localStorage.getItem('todo.' + k) : localStorage.setItem('todo.' + k, v);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const DEFAULT = () => ({ v: 1, cats: [
  { id: 'cm', name: 'Clarified Mind', parent: null },
  { id: 'dd', name: 'Dark Digital', parent: null },
  { id: 'peak', name: 'Peak', parent: 'dd' },
  { id: 'gs', name: 'Genspark', parent: 'dd' },
  { id: 'game', name: 'Game', parent: null },
  { id: 'lang', name: 'Language App', parent: null },
  { id: 'other', name: 'Other Tasks', parent: null },
], tasks: [] });

let state; try { state = JSON.parse(ls('state')) } catch {} if (!state) state = DEFAULT();
let token = ls('token') || '';
let sha = ls('sha') || null;
let dirty = ls('dirty') === '1';
let open = new Set(JSON.parse(ls('open') || '[]'));
let adding = null;          // {parent: id|null} while creating a cat / sub-cat
let status = token ? 'ok' : 'local';
const ser = () => JSON.stringify(state, null, 1);

function save(delay = 700) {
  ls('state', ser()); dirty = true; ls('dirty', '1');
  schedule(delay);
}

/* ---------- GitHub sync ---------- */
const enc = s => { const b = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(o); };
const dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const API = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/`;
const gh = (method, body, p = 'contents/' + CFG.path) =>
  fetch(API + p + (method === 'GET' && p.startsWith('contents') && CFG.branch ? '?ref=' + CFG.branch : ''), {
    method, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
    body: body ? JSON.stringify(body) : undefined,
  });

let timer, busy = false, again = false;
function setStatus(s) { status = s; const d = document.querySelector('.dot'); if (d) d.className = 'dot ' + s; }
function schedule(delay) {
  if (!token) return setStatus('local');
  clearTimeout(timer); timer = setTimeout(push, delay);
}
async function ensureBranch() {
  const r = await gh('GET', null, ''); if (!r.ok) return false;
  const def = (await r.json()).default_branch;
  const ref = await gh('GET', null, 'git/ref/heads/' + def); if (!ref.ok) return false;
  const head = (await ref.json()).object.sha;
  return (await gh('POST', { ref: 'refs/heads/' + CFG.branch, sha: head }, 'git/refs')).ok;
}
async function push(retry = 2) {
  if (!token) return;
  if (busy) { again = true; return; }
  busy = true; setStatus('busy');
  let ok = false;
  try {
    const snap = ser();
    const r = await gh('PUT', { message: 'tasks', content: enc(snap), ...(CFG.branch ? { branch: CFG.branch } : {}), ...(sha ? { sha } : {}) });
    if (r.ok) {
      sha = (await r.json()).content.sha; ls('sha', sha); ok = true;
      if (ser() === snap) { dirty = false; ls('dirty', '0'); }
    } else if (retry && (r.status === 409 || r.status === 422 || r.status === 404)) {
      const g = await gh('GET');
      if (g.ok) sha = (await g.json()).sha;
      else if (g.status === 404) { sha = null; if (CFG.branch) await ensureBranch(); }
      busy = false; return push(retry - 1);
    }
  } catch (e) {}
  busy = false;
  setStatus(ok ? 'ok' : 'err');
  if (again || (ok && dirty)) { again = false; schedule(400); }
}
async function pull() {
  if (!token || busy) return;
  if (dirty) return push();
  busy = true; setStatus('busy');
  let ok = false;
  try {
    const r = await gh('GET');
    if (r.status === 404) { sha = null; busy = false; dirty = true; return push(); }
    if (r.ok) {
      const j = await r.json(); sha = j.sha; ls('sha', sha); ok = true;
      const txt = dec(j.content);
      if (!dirty && txt !== ser()) { state = JSON.parse(txt); ls('state', ser()); render(); }
    }
  } catch (e) {}
  busy = false; setStatus(ok ? 'ok' : 'err');
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const cat = id => state.cats.find(c => c.id === id);
const subsOf = id => state.cats.filter(c => c.parent === id);
const tasksOf = (id, done) => state.tasks.filter(t => t.cat === id && !!t.done === done);
const openCount = id => tasksOf(id, false).length + subsOf(id).reduce((n, s) => n + openCount(s.id), 0);
const sup = n => n ? `<sup>(${n})</sup>` : '';

/* ---------- routing ---------- */
let view = '', vid = null;
function route() { const [, v, id] = (location.hash.slice(1) || '/').split('/'); view = v || ''; vid = id ? decodeURIComponent(id) : null; adding = null; render(); window.scrollTo(0, 0); }
function nav(h) { history.pushState({ app: 1 }, '', h); route(); }
function back() {
  if (history.state && history.state.app) return history.back();
  const t = view === 't' && state.tasks.find(x => x.id === vid);
  history.replaceState(null, '', t && t.done ? '#/a/' + t.cat : '#/'); route();
}
addEventListener('popstate', route);

/* ---------- render ---------- */
const hd = document.getElementById('hd'), app = document.getElementById('app');
const closeBtn = `<button class="ib box" data-act="back" aria-label="Close">${I.x}</button>`;

function catBlock(c, lvl) {
  const isOpen = open.has(c.id), subs = subsOf(c.id), todo = tasksOf(c.id, false), done = tasksOf(c.id, true).length;
  const empty = !subs.length && !todo.length && !done;
  return `<section class="cat l${lvl}">
    <button class="row" data-act="toggle" data-id="${c.id}"><span class="name">${esc(c.name)}${sup(openCount(c.id))}</span><span class="tog">${isOpen ? I.minus : I.plus}</span></button>
    ${isOpen ? `<div class="body">
      <ul class="tasks">${todo.map(t => `<li><button data-act="task" data-id="${t.id}">${esc(t.title) || '·'}</button></li>`).join('')}</ul>
      <label class="add">${I.plus}<input data-add="${c.id}" enterkeyhint="done" autocomplete="off" aria-label="Add task"></label>
      ${subs.map(s => catBlock(s, lvl + 1)).join('')}
      ${adding && adding.parent === c.id ? `<div class="newcat sub"><input data-new="${c.id}" enterkeyhint="done" autocomplete="off"></div>` : ''}
      <div class="tools">
        <button class="ib sm" data-act="archive" data-id="${c.id}" aria-label="Archive">${I.arch}${done ? `<sup>${done}</sup>` : ''}</button>
        ${lvl === 0 ? `<button class="ib sm" data-act="addsub" data-id="${c.id}" aria-label="Add sub-category">${I.sub}</button>` : ''}
        ${empty ? `<button class="ib sm" data-act="delcat" data-id="${c.id}" aria-label="Delete">${I.trash}</button>` : ''}
      </div>
    </div>` : ''}
  </section>`;
}

function render() {
  const a = document.activeElement;
  // don't clobber an open text editor in task view
  if (view === 't' && a && a.tagName === 'TEXTAREA' && document.getElementById('tv')) return;
  const keep = a && a.dataset && (a.dataset.add ? '[data-add="' + a.dataset.add + '"]' : a.dataset.new !== undefined ? '[data-new="' + a.dataset.new + '"]' : null);
  const val = keep ? a.value : '';
  rendering = true;

  if (view === 't') {
    const t = state.tasks.find(x => x.id === vid);
    if (!t) { rendering = false; history.replaceState(null, '', '#/'); return route(); }
    const c = cat(t.cat), p = c && c.parent ? cat(c.parent) : null;
    hd.innerHTML = closeBtn + `<button class="ib" data-act="del" aria-label="Delete">${I.trash}</button>`;
    app.innerHTML = `<div id="tv">
      <div class="path">${p ? esc(p.name) + ' / ' : ''}${esc(c ? c.name : '')}</div>
      <textarea class="title" data-f="title" rows="1">${esc(t.title)}</textarea>
      <textarea class="notes" data-f="notes" rows="4">${esc(t.notes)}</textarea>
      <button class="done ${t.done ? 'on' : ''}" data-act="done" aria-label="Complete">${I.check}</button>
    </div>`;
    app.querySelectorAll('textarea').forEach(fit);
  } else if (view === 'a') {
    const c = cat(vid);
    if (!c) { rendering = false; history.replaceState(null, '', '#/'); return route(); }
    const list = tasksOf(c.id, true).sort((x, y) => (y.doneAt || 0) - (x.doneAt || 0));
    hd.innerHTML = closeBtn + '<span class="sp"></span>';
    app.innerHTML = `<div class="atitle">${I.arch}<span>${esc(c.name)}${sup(list.length)}</span></div>
      <ul class="tasks">${list.map(t => `<li><button data-act="task" data-id="${t.id}">${esc(t.title) || '·'}</button></li>`).join('')}</ul>`;
  } else if (view === 'k') {
    hd.innerHTML = closeBtn + `<button class="ib" data-act="savekey" aria-label="Save">${I.check}</button>`;
    app.innerHTML = `<label class="key">${I.key}<input id="tok" type="password" value="" autocomplete="off" spellcheck="false" enterkeyhint="done"></label>`;
  } else {
    hd.innerHTML = `<span class="sp"></span><button class="ib" data-act="key" aria-label="Sync"><span class="dot ${status}"></span></button>`;
    app.innerHTML = `<div class="list">${state.cats.filter(c => !c.parent).map(c => catBlock(c, 0)).join('')}
      ${adding && adding.parent === null ? `<div class="newcat"><input data-new="" enterkeyhint="done" autocomplete="off"></div>` : ''}
      <div class="foot"><button class="ib sm" data-act="addcat" aria-label="Add category">${I.plus}</button></div></div>`;
  }

  if (keep) { const el = app.querySelector(keep); if (el) { el.value = val; el.focus(); } }
  rendering = false;
}
let rendering = false;
function fit(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

/* ---------- events ---------- */
let armTimer;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === 'toggle') { open.has(id) ? open.delete(id) : open.add(id); ls('open', JSON.stringify([...open])); render(); }
  else if (act === 'task') nav('#/t/' + id);
  else if (act === 'archive') nav('#/a/' + id);
  else if (act === 'key') nav('#/k');
  else if (act === 'back') back();
  else if (act === 'addcat' || act === 'addsub') {
    adding = { parent: act === 'addcat' ? null : id }; render();
    const el = app.querySelector(`[data-new="${adding.parent ?? ''}"]`); el && el.focus();
  }
  else if (act === 'delcat') { state.cats = state.cats.filter(c => c.id !== id); open.delete(id); save(); render(); }
  else if (act === 'done') {
    const t = state.tasks.find(x => x.id === vid); if (!t) return;
    t.done = !t.done; t.doneAt = t.done ? Date.now() : null; b.classList.toggle('on', t.done); save(300);
  }
  else if (act === 'del') {
    if (!b.classList.contains('armed')) { b.classList.add('armed'); clearTimeout(armTimer); armTimer = setTimeout(() => b.classList.remove('armed'), 2500); return; }
    state.tasks = state.tasks.filter(x => x.id !== vid); save(300); back();
  }
  else if (act === 'savekey') saveKey();
});

async function unlock(pw) {
  const u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u(LOCK.s), iterations: LOCK.i, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u(LOCK.v) }, k, u(LOCK.c)));
}
async function saveKey() {
  const el = document.getElementById('tok'), pw = el.value.trim(); if (!pw) return;
  el.disabled = true;
  try { token = await unlock(pw); } catch (e) { el.disabled = false; el.value = ''; el.parentNode.classList.add('bad'); setTimeout(() => el.parentNode.classList.remove('bad'), 600); el.focus(); return; }
  ls('token', token); setStatus('ok');
  if (history.state && history.state.app) history.back(); else { history.replaceState(null, '', '#/'); route(); }
  pull();
}

document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Escape') {
    if (el.dataset && el.dataset.new !== undefined) { adding = null; render(); return; }
    if (view) { el.blur && el.blur(); back(); }
    return;
  }
  if (e.key !== 'Enter' || e.isComposing) return;
  if (el.dataset.add !== undefined) {
    e.preventDefault();
    const title = el.value.trim(); if (!title) return;
    state.tasks.push({ id: uid(), cat: el.dataset.add, title, notes: '', done: false, created: Date.now() });
    el.value = ''; save(); render();
  } else if (el.dataset.new !== undefined) {
    e.preventDefault();
    const name = el.value.trim(), parent = el.dataset.new || null;
    adding = null;
    if (name) { const c = { id: uid(), name, parent }; state.cats.push(c); if (parent) open.add(parent); ls('open', JSON.stringify([...open])); save(); }
    el.value = ''; render();
  } else if (el.dataset.f === 'title') {
    e.preventDefault(); app.querySelector('.notes').focus();
  } else if (el.id === 'tok') saveKey();
});

document.addEventListener('focusout', e => {
  const el = e.target;
  if (rendering || !el.dataset || el.dataset.new === undefined) return;
  setTimeout(() => { if (adding && !el.value.trim() && document.activeElement !== el) { adding = null; render(); } }, 120);
});

document.addEventListener('input', e => {
  const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
  const t = state.tasks.find(x => x.id === vid); if (!t) return;
  t[f] = f === 'title' ? el.value.replace(/\n/g, ' ') : el.value;
  fit(el); save(1200);
});

/* ---------- start ---------- */
if (location.hash.startsWith('#key=')) { token = decodeURIComponent(location.hash.slice(5)).trim(); ls('token', token); status = 'ok'; history.replaceState(null, '', location.pathname); }
if (!token && !location.hash) history.replaceState(null, '', '#/k');
route();
if (dirty) schedule(300); else pull();
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
addEventListener('focus', pull);
setInterval(() => { if (!document.hidden) pull(); }, 60000);
</script>
</body>
</html>
